<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自习室查询 · 智慧自习室信息与数据展示中心</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- ============ 全站统一导航 ============ -->
  <nav class="navbar navbar-expand-lg navbar-dark site-nav sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M12 3 1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-3.72v3.71z"/>
        </svg>
        智慧自习室
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="rooms.html">自习室查询</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">数据统计</a></li>
          <li class="nav-item"><a class="nav-link" href="scene.html">三维导览</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-lg-5">
    <!-- ============ 页头 ============ -->
    <header class="mb-4">
      <h1 class="h3 fw-bold">自习室查询</h1>
      <p class="text-muted mb-0">数据来自本地 <code>data/rooms.json</code>，支持关键词搜索与楼宇、状态组合筛选。</p>
    </header>

    <!-- 加载失败提示区 -->
    <div id="load-error"></div>

    <!-- ============ 查询工具栏 ============ -->
    <section class="card border-0 shadow-sm mb-4" aria-label="查询工具栏">
      <div class="card-body">
        <!-- 关键词搜索 -->
        <div class="mb-3">
          <label for="search-input" class="form-label fw-semibold">关键词搜索</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true">🔍</span>
            <input type="search" class="form-control" id="search-input"
                   placeholder="输入自习室名称或楼宇，如：图书馆 / 考研" autocomplete="off">
            <button class="btn btn-outline-secondary" type="button" id="search-clear">清空</button>
          </div>
        </div>

        <!-- 楼宇筛选（按钮由数据动态生成） -->
        <div class="filter-group mb-3" id="building-filters" role="group" aria-label="按楼宇筛选">
          <span class="filter-label">楼宇：</span>
          <span class="text-muted small ms-auto" id="building-loading">加载中…</span>
        </div>

        <!-- 状态筛选 -->
        <div class="filter-group" id="status-filters" role="group" aria-label="按状态筛选">
          <span class="filter-label">状态：</span>
          <button type="button" class="btn btn-sm btn-outline-success active" data-status="all">全部</button>
          <button type="button" class="btn btn-sm btn-outline-success" data-status="开放">开放中</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-status="维修">维修</button>
          <button type="button" class="btn btn-sm btn-outline-danger" data-status="闭馆">闭馆</button>
        </div>
      </div>
    </section>

    <!-- ============ 结果区 ============ -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <p class="text-muted small mb-0" id="room-count" aria-live="polite">正在加载自习室…</p>
    </div>
    <div class="row g-3" id="room-list">
      <div class="col-12">
        <div class="loading-placeholder">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 mb-0">正在加载自习室数据…</p>
        </div>
      </div>
    </div>
  </main>

  <!-- ============ 页脚 ============ -->
  <footer class="site-footer py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 small">
      <span>© <span data-year>2026</span> 智慧自习室信息与数据展示中心</span>
      <span><a href="index.html">首页</a> / <a href="stats.html">数据统计</a> / <a href="scene.html">三维导览</a></span>
    </div>
  </footer>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/rooms.js"></script>
</body>
</html>
